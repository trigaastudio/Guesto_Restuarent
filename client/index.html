<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/browser-icon.png" />
  <link rel="apple-touch-icon" href="/pwa-192x192.png" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <!-- Basic SEO -->
  <title>GuestO Restaurant | Best Dining Experience</title>
  <meta name="description" content="Welcome to GuestO Restaurant. Enjoy the best dining experience, explore our menu, and order online for quick delivery or dine-in!" />
  <meta name="keywords" content="restaurant, food, dining, online order, takeout, dine-in, GuestO" />
  <meta name="author" content="GuestO Restaurant" />
  
  <!-- Open Graph / Social Media -->
  <meta property="og:title" content="GuestO Restaurant" />
  <meta property="og:description" content="Enjoy the best dining experience and explore our delicious menu." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://www.guestorestaurant.in" />
  <meta property="og:image" content="/logo-golden.png" />

  <!-- Canonical URL -->
  <link rel="canonical" href="https://www.guestorestaurant.in" />
  <script>
    (function () {
      const theme = localStorage.getItem('theme');
      if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
